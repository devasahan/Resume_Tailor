{% extends "base.html" %}
{% block title %}History - Resume Tailor{% endblock %}
{% block content %}
<h1>History</h1>
<p class="sub" id="sub">Every click on a Download button, by every account. Previews are not counted.</p>
<div class="panel">
  <div class="row" style="margin-bottom:10px">
    <label for="account" style="margin:0">Account</label>
    <select id="account" style="width:auto"><option value="">All accounts</option></select>
    <span class="small muted" id="spent"></span>
  </div>
  <table><thead><tr>
    <th>When (UTC)</th><th>Account</th><th>Resume of</th><th>Company</th><th>Role</th><th>File</th><th>Model</th><th>Cost</th><th></th>
  </tr></thead><tbody id="rows"></tbody></table>
</div>
{% endblock %}
{% block scripts %}
<script>
const FILES = { resume: 'Resume', cover_letter: 'Cover letter' };
let accountsShown = false;

async function load() {
  const chosen = $('#account').value;
  const data = await api('/api/downloads' + (chosen ? `?user_id=${encodeURIComponent(chosen)}` : ''));
  $('#spent').textContent = `Spent today (all tailoring, downloaded or not): ${money(data.cost_today)}. History is deleted after the retention period set in Settings.`;
  if (!accountsShown) {
    $('#account').append(...data.accounts.map(a => el('option', { value: a.user_id, text: `${a.email} (${a.downloads})` })));
    accountsShown = true;
  }
  $('#rows').replaceChildren(...(data.downloads.length ? data.downloads.map(d => {
    const file = d.kind === 'cover_letter' ? 'cover.pdf' : 'resume.pdf';
    return el('tr', {},
      el('td', { text: d.created_at.replace('T', ' ').replace('Z', '') }),
      el('td', { text: d.email }), el('td', { text: d.candidate || '-' }), el('td', { text: d.company || '-' }),
      el('td', { text: d.role || '-' }),
      el('td', {}, chip(`${FILES[d.kind] || d.kind} ${d.format.toUpperCase()}`, d.kind === 'cover_letter' ? 'ok' : ''),
        el('div', { class: 'small muted', text: d.filename })),
      el('td', { text: d.model || '-' }), el('td', { text: money(d.cost_usd) }),
      el('td', {}, d.run_kept
        ? el('a', { href: `/api/runs/${d.run_id}/${file}`, target: '_blank', rel: 'noopener', text: 'View' })
        : el('span', { class: 'small muted', text: 'run deleted' })));
  }) : [el('tr', {}, el('td', { colspan: 9, class: 'muted', text: 'No downloads yet.' }))]));
}
$('#account').addEventListener('change', () => load().catch(showError));
function showError(err) { $('#rows').replaceChildren(el('tr', {}, el('td', { colspan: 9 }, notice('bad', err.message)))); }
load().catch(showError);
</script>
{% endblock %}
