{% extends "base.html" %}
{% block title %}History - Resume Tailor{% endblock %}
{% block content %}
<div class="page-head">
  <h1>History</h1>
  <p class="sub" id="sub">Every click on a Download button, by every account, grouped by day in Texas time (Arlington). Previews are not counted.</p>
</div>
<div class="panel">
  <div class="row">
    <label for="account" style="margin:0">Account</label>
    <select id="account" style="width:auto"><option value="">All accounts</option></select>
    <span class="small muted" id="spent"></span>
  </div>
  <p class="totals" id="totals"></p>
</div>
<div id="days"></div>
<p class="small muted" id="more"></p>
{% endblock %}
{% block scripts %}
<script>
const FILES = { resume: 'Resume', cover_letter: 'Cover letter' };
const LIMIT = 1000;  // the most the server sends at once
let accountsShown = false;

// Days and times in Arlington, Texas (US Central time, with daylight saving), whatever the viewer's computer uses.
const ZONE = {{ local_zone | tojson }};
const dayKey = new Intl.DateTimeFormat('en-CA', { timeZone: ZONE, year: 'numeric', month: '2-digit', day: '2-digit' });
const dayName = new Intl.DateTimeFormat('en-US', { timeZone: ZONE, weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
const timeName = new Intl.DateTimeFormat('en-US', { timeZone: ZONE, hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });

function keyBefore(key) {  // '2026-03-01' -> '2026-02-28', exact on daylight-saving days too
  const [y, m, d] = key.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d - 1)).toISOString().slice(0, 10);
}

function groupByDay(downloads) {  // newest day first, newest download first
  const days = new Map();
  for (const d of downloads) {
    const when = new Date(d.created_at);
    const key = isNaN(when) ? 'unknown' : dayKey.format(when);
    if (!days.has(key)) days.set(key, { key, label: isNaN(when) ? 'Unknown date' : dayName.format(when), items: [] });
    days.get(key).items.push(d);
  }
  for (const group of days.values()) group.items.sort((x, y) => (Date.parse(y.created_at) || 0) - (Date.parse(x.created_at) || 0));
  return [...days.values()].sort((x, y) => (x.key === 'unknown') - (y.key === 'unknown') || y.key.localeCompare(x.key));
}

function dayCost(items) {  // each row carries its run's whole cost: count every run once, at its latest figure
  const runs = new Map();
  for (const d of items) runs.set(d.run_id, Math.max(runs.get(d.run_id) || 0, d.cost_usd || 0));
  return [...runs.values()].reduce((a, b) => a + b, 0);
}

function jobs(items) {  // resumes and cover letters, each tailored job counted once however often it was downloaded
  const seen = { resume: new Set(), cover_letter: new Set() };
  for (const d of items) if (seen[d.kind]) seen[d.kind].add(d.run_id);
  return { resume: seen.resume.size, cover_letter: seen.cover_letter.size };
}
function counted(n, word, more = '') { return `${n}${more} ${word}${n === 1 && !more ? '' : 's'}`; }

function row(d) {
  const file = d.kind === 'cover_letter' ? 'cover.pdf' : 'resume.pdf';
  const when = new Date(d.created_at);
  return el('tr', {},
    el('td', { class: 'nowrap', text: isNaN(when) ? d.created_at : timeName.format(when) }),
    el('td', { text: d.email }), el('td', { text: d.candidate || '-' }), el('td', { text: d.company || '-' }),
    el('td', { text: d.role || '-' }),
    el('td', {}, chip(`${FILES[d.kind] || d.kind} ${d.format.toUpperCase()}`, d.kind === 'cover_letter' ? 'ok' : ''),
      el('div', { class: 'small muted', text: d.filename })),
    el('td', { text: d.model || '-' }), el('td', { text: money(d.cost_usd) }),
    el('td', {}, d.run_kept
      ? el('a', { href: `/api/runs/${d.run_id}/${file}`, target: '_blank', rel: 'noopener', text: 'View' })
      : el('span', { class: 'small muted', text: 'run deleted' })));
}

function day(group, open, today, partial) {  // partial: older downloads of this day were not loaded
  const count = jobs(group.items), more = partial ? '+' : '';
  const name = group.key === today ? `Today · ${group.label}` : group.key === keyBefore(today) ? `Yesterday · ${group.label}` : group.label;
  return el('details', { class: 'panel day', open },
    el('summary', {},
      el('span', { class: 'day-name', text: name }),
      el('span', { class: 'day-meta', title: 'Each tailored job counted once, however often it was downloaded; and what those jobs cost',
        text: `${counted(count.resume, 'resume', more)} · ${counted(count.cover_letter, 'cover letter', more)} · ${money(dayCost(group.items))}`
          + (partial ? ' (older ones not shown)' : '') })),
    el('div', { class: 'table-wrap' }, el('table', { class: 'wide' },
      el('thead', {}, el('tr', {}, ['Time', 'Account', 'Resume of', 'Company', 'Role', 'File', 'Model', 'Cost', ''].map(h => el('th', { text: h })))),
      el('tbody', {}, group.items.map(row)))));
}

async function load() {
  const chosen = $('#account').value;
  const query = new URLSearchParams({ limit: LIMIT });
  if (chosen) query.set('user_id', chosen);
  const data = await api('/api/downloads?' + query);
  $('#spent').textContent = `Spent today (since midnight Texas time; all tailoring, downloaded or not): ${money(data.cost_today)}. History is deleted after the retention period set in Settings.`;
  if (!accountsShown) {
    $('#account').append(...data.accounts.map(a => el('option', { value: a.user_id, text: `${a.email} (${a.downloads})` })));
    accountsShown = true;
  }
  const today = dayKey.format(new Date());
  $('#totals').replaceChildren(el('strong', { text: 'Total: ' }),
    `${counted(data.totals.resume, 'resume')} · ${counted(data.totals.cover_letter, 'cover letter')}`,
    el('span', { class: 'small muted', text: ' (each tailored job counted once, however often it was downloaded)' }));
  const groups = groupByDay(data.downloads);
  const total = data.accounts.filter(a => !chosen || String(a.user_id) === chosen).reduce((n, a) => n + a.downloads, 0);
  const cut = data.downloads.length >= LIMIT && total > data.downloads.length;  // the newest LIMIT only: the oldest day is cut
  $('#days').replaceChildren(groups.length ? groups.map((g, i) => day(g, i === 0, today, cut && i === groups.length - 1))
    : el('div', { class: 'panel muted', text: 'No downloads yet.' }));
  $('#more').textContent = cut ? `Showing the newest ${data.downloads.length} of ${total} downloads. The oldest day shown is not complete.` : '';
}
$('#account').addEventListener('change', () => load().catch(showError));
function showError(err) { $('#days').replaceChildren(notice('bad', err.message)); $('#more').textContent = ''; $('#totals').textContent = ''; }
load().catch(showError);
</script>
{% endblock %}
