{% extends "base.html" %}
{% block title %}Sign up - Resume Tailor{% endblock %}
{% block content %}
<div class="auth">
  <h1>Sign up</h1>
  <p class="sub">Ask for an account. You can log in as soon as the admin approves it.</p>
  <form class="panel" id="form" novalidate>
    <label for="email" style="margin-top:0">Email</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="password">Password <span class="opt">(at least 10 characters)</span></label>
    <input type="password" id="password" autocomplete="new-password" required>
    <label for="confirm">Password again</label>
    <input type="password" id="confirm" autocomplete="new-password" required>
    <button class="primary" id="submit" type="submit">Sign up</button>
    <div id="message"></div>
  </form>
  <p class="small muted">Already have an account? <a href="/login">Log in</a>.</p>
</div>
{% endblock %}
{% block scripts %}
<script>
$('#form').addEventListener('submit', async event => {
  event.preventDefault();
  $('#message').replaceChildren();
  if ($('#password').value !== $('#confirm').value) {
    $('#message').replaceChildren(notice('bad', 'The two passwords do not match.'));
    return;
  }
  $('#submit').disabled = true;
  try {
    const data = await api('/api/signup', { method: 'POST', body: { email: $('#email').value, password: $('#password').value, confirm: $('#confirm').value } });
    $('#form').replaceChildren(notice('ok', data.message), el('a', { class: 'btn', href: '/login', text: 'Go to log in' }));
  } catch (err) {
    $('#message').replaceChildren(notice('bad', err.message));
    $('#submit').disabled = false;
  }
});
$('#email').focus();
</script>
{% endblock %}
