  - id: kimi-k2.6
    label: Kimi K2.6
    provider: openai_compat
    model: kimi-k2.6
    base_url: https://api.moonshot.ai/v1
    key_env: MOONSHOT_API_KEY
    price_in: 0.95
    price_out: 4.00
    data_region: UNKNOWN
    verified: false
    settings: {json_mode: json_object, max_output_tokens: 16000}
    notes: Open weights, so a US/EU host (Together, Fireworks, DeepInfra) is an alternative if you add it here.

  # Offline demo models: no key, no network, no cost. They produce plausible but generic text
  # so the whole app can be tried end to end. Three styles make Compare mode meaningful.
  - id: demo-concise
    label: Demo (concise)
    provider: fake
    model: demo-concise
    price_in: 0
    price_out: 0
    data_region: DEMO
    verified: true
    settings: {style: concise}
    notes: Offline demo, template-based text.

  - id: demo-detailed
