# Model registry. The app reads this file at startup.
#
# A model shows up as usable only when its key_env variable is set (demo models need no key).
#
# Fields
#   id           unique id used in the UI, settings and run history
#   provider     anthropic | openai_compat | fake
#   model        the exact model string sent to the provider
#   base_url     openai_compat only: API root that serves POST {base_url}/chat/completions
#   key_env      environment variable holding the API key
#   price_in/out USD per 1M tokens (used for cost estimates and the daily cap)
#   data_region  US | EU | SG | CN | UNKNOWN | DEMO. Settings -> allowed regions controls which can be used
#   verified     false = model string / price came from third-party sources, run `python -m app.cli check`
#   settings     provider-specific knobs:
#                  effort            (anthropic) low | medium | high | xhigh | max
#                  refusal_fallback  (anthropic) retry a safety-declined request on Anthropic's default fallback model
#                  reasoning_effort  (openai_compat) low | medium | high, sent only if the provider accepts it
#                  json_mode         (openai_compat) json_schema | json_object | none
#                  max_tokens_param  (openai_compat) name of the token-limit field: max_tokens (default) or
#                                    max_completion_tokens for providers that reject the older name
#                  max_output_tokens cap on generated tokens per call. Reasoning tokens count against it,
#                                    so keep it generous (16000) or thinking models can run out before the JSON ends
#
# Prices and model strings below were collected in October 2026 from third-party
# sites unless verified: true. Vendors change both often, so confirm before relying on them.

models:
  - id: claude-sonnet-5-5
    label: Claude Sonnet 5.5
    provider: anthropic
    model: claude-sonnet-5-5
    key_env: ANTHROPIC_API_KEY
    price_in: 2.00
    price_out: 10.00
    data_region: US
    verified: true
    settings: {effort: medium, refusal_fallback: true, max_output_tokens: 16000}
    notes: Quality baseline. Structured output via output_config.format; thinking cannot be disabled on this model.

  - id: gemini-3.8-flash
    label: Gemini 3.8 Flash
    provider: openai_compat
    model: gemini-3.8-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GEMINI_API_KEY
    price_in: 0.75
    price_out: 3.75
    data_region: US
    verified: true
    settings: {reasoning_effort: low, json_mode: json_schema, max_output_tokens: 16000}
    notes: "Introductory price $0.75 / $3.75 per 1M tokens until 2026-12-31; standard $1.50 / $7.50 from 2027-01-01 (update price_in / price_out then). Use a paid key: free-tier data may be used to improve Google models."

  - id: gemini-3.5-flash-lite
    label: Gemini 3.5 Flash-Lite
    provider: openai_compat
    model: gemini-3.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GEMINI_API_KEY
    price_in: 0.30
    price_out: 2.50
    data_region: US
    verified: false
    settings: {reasoning_effort: low, json_mode: json_schema, max_output_tokens: 16000}
    notes: Cheap model, good for parsing the uploaded base resume.

  - id: grok-4.3
    label: Grok 4.3
    provider: openai_compat
    model: grok-4.3
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
    price_in: 1.25
    price_out: 2.50
    data_region: US
    verified: false
    settings: {reasoning_effort: low, json_mode: json_schema, max_output_tokens: 16000}
    notes: xAI keeps API data 30 days by default (zero-data-retention is an enterprise option).

  - id: grok-4.7
    label: Grok 4.7
    provider: openai_compat
    model: grok-4.7
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
