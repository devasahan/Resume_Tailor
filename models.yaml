    model: demo-detailed
    price_in: 0
    price_out: 0
    data_region: DEMO
    verified: true
    settings: {style: detailed}
    notes: Offline demo, produces long bullets so the two-page fit logic can be seen at work.

  - id: demo-flaky
    label: Demo (flaky)
    provider: fake
    model: demo-flaky
    price_in: 0
    price_out: 0
    data_region: DEMO
    verified: true
    settings: {style: flaky}
    notes: Offline demo that returns invalid output at first, to show retries and fallback.
