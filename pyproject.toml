[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-tailor"
version = "0.1.0"
description = "Multi-model resume tailoring app: fixed facts in, tailored one-page ATS resume out."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "anthropic>=1.0",
    "httpx>=0.27",
    "weasyprint>=62",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "render/templates/*", "web/templates/*", "web/static/*"]
